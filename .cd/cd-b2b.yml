name: Scratch CD Notes back-to-back
# Temporary branch (deleted after use): builder CD's back-to-back meetings check through the real
# app (local calendar feed, null-sink mic, stub server). Scratch data only. Nothing ships.

on:
  push:
    branches: [ci/cd-b2b*]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"

jobs:
  linux:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-desktop-deps
      - run: sudo apt-get install -y -qq --no-install-recommends xvfb imagemagick openbox dbus dbus-x11 xdotool at-spi2-core gir1.2-atspi-2.0 python3-gi gir1.2-gtk-3.0 pulseaudio pulseaudio-utils ffmpeg fonts-noto-core > /dev/null
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-unknown-linux-gnu
          prefix-key: v1-rust-meetings
          save-cache: "false"
          workspaces: apps/desktop-gpui -> target
      - run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: x86_64-unknown-linux-gnu
      - run: |
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
      - run: cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --release --bin cap-gpui 2>&1 | tail -2
      - name: Back to back
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/native-deps/lib"
          APP="$GITHUB_WORKSPACE/apps/desktop-gpui/target/release/cap-gpui"
          Xvfb :99 -screen 0 1600x1000x24 > /dev/null 2>&1 &
          sleep 2
          for v in ${CD_VARIANTS:-manual}; do
            DISPLAY=:99 XDG_SESSION_TYPE=x11 dbus-run-session -- bash -c '
              openbox > /dev/null 2>&1 &
              /usr/libexec/at-spi-bus-launcher --launch-immediately > /dev/null 2>&1 &
              sleep 2
              gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus --method org.freedesktop.DBus.Properties.Set org.a11y.Status IsEnabled "<true>" > /dev/null 2>&1
              bash .cd/b2b.sh "$0" "$1" "$2"' "$APP" "$RUNNER_TEMP/walk" "$v"
          done
      - if: always()
        run: find "$RUNNER_TEMP/walk" -mindepth 2 -maxdepth 2 -type d -name data -exec rm -rf {} + ; true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cd-b2b-linux
          path: ${{ runner.temp }}/walk
          retention-days: 3
