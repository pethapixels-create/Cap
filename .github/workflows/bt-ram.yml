name: BT real-app fixtures macOS
# Scratch only (never landed): base vs fix vs fix2 of the diarizer on BT's fixtures through the real app, macOS.
on:
  push:
    branches: [ci/bt-ram]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bt-ram-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
  BASE_SHA: 09bdc687c1
  FIXTURES: "music ret default"
  REPS: "1 2"
jobs:
  macos:
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 300
    env: { TARGET: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@1.95.0
        with: { targets: aarch64-apple-darwin }
      - uses: ./.github/actions/setup-rust-cache
        with: { target: aarch64-apple-darwin, prefix-key: v1-rust-gpui, save-cache: "false", workspaces: apps/desktop-gpui -> target }
      - shell: bash
        run: node scripts/setup.js
        env: { RUST_TARGET_TRIPLE: aarch64-apple-darwin }
      - run: node scripts/sync-desktop-versions.mjs && ./scripts/prepare-gpui-dependency.sh
      - name: Build fix, fix2 and base
        run: |
          set -e
          d=apps/desktop-gpui/target/release; mkdir -p $RUNNER_TEMP/bin
          dz=apps/desktop-gpui/diarize/src/diarizer.rs
          cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --release --bin cap-gpui
          cp $d/cap-gpui $RUNNER_TEMP/bin/cap-gpui-fix
          cp $dz $RUNNER_TEMP/diarizer-fix.rs
          sed -i.bak 's/const RETURN_LAG_FRAMES: (i64, i64) = (6, 50);/const RETURN_LAG_FRAMES: (i64, i64) = (6, 150);/' $dz && grep -q '(6, 150)' $dz && rm -f $dz.bak
          cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --release --bin cap-gpui
          cp $d/cap-gpui $RUNNER_TEMP/bin/cap-gpui-fix2
          git show $BASE_SHA:apps/desktop-gpui/diarize/src/diarizer.rs > $dz
          git show $BASE_SHA:apps/desktop-gpui/diarize/src/diarizer/tests.rs > apps/desktop-gpui/diarize/src/diarizer/tests.rs
          cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --release --bin cap-gpui
          cp $d/cap-gpui $RUNNER_TEMP/bin/cap-gpui-base
          md5 $RUNNER_TEMP/bin/*
      - run: brew install ffmpeg > /dev/null 2>&1 || true; ffmpeg -version | head -1
      - name: Audio devices, display and permissions
        run: |
          set -euo pipefail
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 || true
          nohup caffeinate -dimsu > /dev/null 2>&1 &
          brew install --cask blackhole-2ch
          brew install switchaudio-osx
          sudo killall coreaudiod || true
          for _ in $(seq 1 30); do SwitchAudioSource -a -t output | grep -qx "BlackHole 2ch" && break; sleep 1; done
          SwitchAudioSource -s "BlackHole 2ch" -t output
          SwitchAudioSource -s "BlackHole 2ch" -t input
          SwitchAudioSource -c -t output
          ls $RUNNER_TEMP/bin/cap-gpui-* > "$RUNNER_TEMP/clients"
          p=$$; while [ "$p" -gt 1 ]; do ps -o comm= -p "$p"; p=$(ps -o ppid= -p "$p" | tr -d ' '); done >> "$RUNNER_TEMP/clients"
          db="/Library/Application Support/com.apple.TCC/TCC.db"; user_db="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          now=$(date +%s)
          sort -u "$RUNNER_TEMP/clients" | grep '^/' | while read -r client; do
            for service in kTCCServiceScreenCapture kTCCServiceMicrophone kTCCServiceAudioCapture; do
              row="INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier,flags,last_modified) VALUES ('$service','$client',1,2,4,1,'UNUSED',0,$now);"
              sudo sqlite3 "$db" "$row" || true
              sqlite3 "$user_db" "$row" || true
            done
            echo "granted $client"
          done
          killall tccd || true; sudo killall tccd || true; sleep 2
      - uses: actions/cache@v4
        with: { path: "${{ runner.temp }}/meeting-models", key: "meeting-models-v1-${{ hashFiles('scripts/ci/meetings/models.sh') }}" }
      - run: bash scripts/ci/meetings/models.sh "$RUNNER_TEMP/meeting-models"
      - name: Meetings
        run: |
          ORT=$(find "$GITHUB_WORKSPACE/target/native-deps" -name 'libonnxruntime*.dylib' | head -1); echo "ORT=$ORT"
          for rep in $REPS; do for fx in $FIXTURES; do for arm in base fix fix2; do
            F=$GITHUB_WORKSPACE/bt-fx/$fx; [ $fx = default ] && F=$GITHUB_WORKSPACE/apps/desktop-gpui/tests/fixtures/meetings
            R=$RUNNER_TEMP/bt/$fx-$arm-$rep/local
            ORT_DYLIB_PATH="$ORT" CAP_MEETINGS_MODELS="$RUNNER_TEMP/meeting-models" \
              bash scripts/ci/meetings/mac.sh "$RUNNER_TEMP/bin/cap-gpui-$arm" "$R" "$F" > "$RUNNER_TEMP/bt-$fx-$arm-$rep.log" 2>&1 || true
            echo "== $fx $arm $rep $(cat $R/score.json 2>/dev/null)"
            grep -a 'meeting health line' "$R/app.log" 2>/dev/null | tail -1 | cut -c1-200 || true
          done; done; done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bt-ram-macos
          path: |
            ${{ runner.temp }}/bt/*/local/score.json
            ${{ runner.temp }}/bt/*/local/offsets.json
            ${{ runner.temp }}/bt/*/local/app.log
            ${{ runner.temp }}/bt/*/local/transcript.jsonl
            ${{ runner.temp }}/bt-*.log
          retention-days: 7
