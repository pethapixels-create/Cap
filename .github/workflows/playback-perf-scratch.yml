name: Playback perf scratch

on:
  push:
    branches:
      - "scratch/playback-perf*"

concurrency:
  group: playback-perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE_REF: ""
  ROUNDS: "5"
  KINDS: "play,edit"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  macos:
    name: macOS build and bench
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 170
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: CapSoftware/cap-performance-fixtures
          path: performance-fixtures
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ env.TARGET }}
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ env.TARGET }}
          prefix-key: v1-playback-perf
          save-cache: "true"
          cache-on-failure: "true"
          workspaces: apps/desktop-gpui -> target
      - name: Setup
        run: |
          set -euo pipefail
          node scripts/setup.js
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
        env:
          RUST_TARGET_TRIPLE: ${{ env.TARGET }}
      - name: Build
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bins"
          release="$GITHUB_WORKSPACE/apps/desktop-gpui/target/$TARGET/release"
          build() {
            cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked \
              --target "$TARGET" --release --bin cap-gpui 2>&1 | grep -v "^ *Compiling" | tail -8
            mkdir -p "$out/$1"
            cp "$release/cap-gpui" "$out/$1/cap-gpui"
          }
          build head
          if [[ -n "$BASE_REF" ]]; then
            git diff --name-only --diff-filter=A "$BASE_REF" HEAD -- apps crates | xargs -I{} rm -f "{}"
            git checkout "$BASE_REF" -- apps crates Cargo.toml Cargo.lock
            git diff --stat HEAD -- apps crates | tail -3
            build base
            if cmp -s "$out/head/cap-gpui" "$out/base/cap-gpui"; then echo "::error::identical binaries"; exit 1; fi
          fi
          cp -R "$GITHUB_WORKSPACE/target/Frameworks" "$out/Frameworks"
          for side in head base; do
            [[ -d "$out/$side" ]] && ln -sfn ../Frameworks "$out/$side/Frameworks"
          done
          git rev-parse HEAD > "$out/head.sha"
          ls -la "$out" "$out/head"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bench
        run: |
          set -uo pipefail
          python -m pip install -q psutil
          sudo pmset -a displaysleep 0 sleep 0 || true
          caffeinate -u -t 2
          caffeinate -d -i -t 7000 &
          system_profiler SPDisplaysDataType | grep -E "Chipset|Resolution|Metal" || true
          sysctl -n hw.ncpu hw.memsize
          out="$RUNNER_TEMP/bins"
          bins=(--bin "head=$out/head/cap-gpui")
          [[ -d "$out/base" ]] && bins=(--bin "base=$out/base/cap-gpui" "${bins[@]}")
          python .github/playback-perf/bench.py "${bins[@]}" \
            --fixture "ref=$GITHUB_WORKSPACE/performance-fixtures/reference-recording.cap" \
            --out "$RUNNER_TEMP/bench" --rounds "$ROUNDS" --kinds "$KINDS" \
            --label "macOS Blacksmith 6 vCPU" --summary "$GITHUB_STEP_SUMMARY"
      - name: Print logs
        if: always()
        run: |
          cat "$RUNNER_TEMP/bench/summary.md" || true
          for log in "$RUNNER_TEMP"/bench/ref-play-*-0.log; do echo "=== $log"; grep -E "latency-bench|Playback stats|playback fps|WARN|ERROR|panicked" "$log" | cut -c1-400 | head -60; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-macos
          path: ${{ runner.temp }}/bench
          retention-days: 5
      - uses: actions/upload-artifact@v4
        with:
          name: bins-macos
          path: ${{ runner.temp }}/bins
          retention-days: 5

  linux:
    name: Linux build and bench
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: CapSoftware/cap-performance-fixtures
          path: performance-fixtures
          persist-credentials: false
      - name: Install Linux desktop dependencies
        uses: ./.github/actions/install-desktop-deps
      - run: sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools dbus x11-utils >/dev/null
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-unknown-linux-gnu
          prefix-key: v1-playback-perf
          save-cache: "true"
          cache-on-failure: "true"
          workspaces: apps/desktop-gpui -> target
      - name: Setup
        run: |
          set -euo pipefail
          node scripts/setup.js
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
        env:
          RUST_TARGET_TRIPLE: x86_64-unknown-linux-gnu
      - name: Build
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bins"
          release="$GITHUB_WORKSPACE/apps/desktop-gpui/target/release"
          build() {
            cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked \
              --release --bin cap-gpui 2>&1 | grep -v "^ *Compiling" | tail -8
            mkdir -p "$out/$1"
            cp "$release/cap-gpui" "$out/$1/cap-gpui"
          }
          build head
          if [[ -n "$BASE_REF" ]]; then
            git diff --name-only --diff-filter=A "$BASE_REF" HEAD -- apps crates | xargs -I{} rm -f "{}"
            git checkout "$BASE_REF" -- apps crates Cargo.toml Cargo.lock
            git diff --stat HEAD -- apps crates | tail -3
            build base
            if cmp -s "$out/head/cap-gpui" "$out/base/cap-gpui"; then echo "::error::identical binaries"; exit 1; fi
          fi
          mkdir -p "$out/libs"
          cp -a target/native-deps/lib/. "$out/libs/"
          git rev-parse HEAD > "$out/head.sha"
          ls -la "$out" "$out/head"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bench (Xvfb, lavapipe)
        run: |
          set -uo pipefail
          python -m pip install -q psutil
          nproc; free -g | head -2
          out="$RUNNER_TEMP/bins"
          bins=(--bin "head=$out/head/cap-gpui")
          [[ -d "$out/base" ]] && bins=(--bin "base=$out/base/cap-gpui" "${bins[@]}")
          export VK_LOADER_LAYERS_DISABLE=VK_LAYER_MESA_device_select
          dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" \
            python .github/playback-perf/bench.py "${bins[@]}" \
            --fixture "ref=$GITHUB_WORKSPACE/performance-fixtures/reference-recording.cap" \
            --lib-dir "$out/libs" \
            --out "$RUNNER_TEMP/bench" --rounds "$ROUNDS" --kinds "$KINDS" \
            --label "Linux Blacksmith 8 vCPU, Xvfb + lavapipe" --summary "$GITHUB_STEP_SUMMARY"
      - name: Print logs
        if: always()
        run: |
          cat "$RUNNER_TEMP/bench/summary.md" || true
          for log in "$RUNNER_TEMP"/bench/ref-play-*-0.log; do echo "=== $log"; grep -E "latency-bench|Playback stats|playback fps|WARN|ERROR|panicked|adapter" "$log" | cut -c1-400 | head -60; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-linux
          path: ${{ runner.temp }}/bench
          retention-days: 5
      - uses: actions/upload-artifact@v4
        with:
          name: bins-linux
          path: ${{ runner.temp }}/bins
          retention-days: 5

  windows-build:
    name: Windows build
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 170
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-pc-windows-msvc
          prefix-key: v1-playback-perf
          save-cache: "true"
          cache-on-failure: "true"
          workspaces: apps/desktop-gpui -> target
      - name: Setup
        shell: bash
        run: |
          set -euo pipefail
          node scripts/setup.js
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bins"
          release="$GITHUB_WORKSPACE/apps/desktop-gpui/target/$TARGET/release"
          build() {
            cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked \
              --target "$TARGET" --release --bin cap-gpui 2>&1 | grep -v "^ *Compiling" | tail -8
            mkdir -p "$out/$1"
            cp "$release/cap-gpui.exe" "$out/$1/cap-gpui.exe"
            cp "$GITHUB_WORKSPACE"/target/release/*.dll "$out/$1/" || true
            find "$release" -maxdepth 1 -name '*.dll' -exec cp {} "$out/$1/" \;
          }
          build head
          if [[ -n "$BASE_REF" ]]; then
            git diff --name-only --diff-filter=A "$BASE_REF" HEAD -- apps crates | xargs -I{} rm -f "{}"
            git checkout "$BASE_REF" -- apps crates Cargo.toml Cargo.lock
            git diff --stat HEAD -- apps crates | tail -3
            build base
            if cmp -s "$out/head/cap-gpui.exe" "$out/base/cap-gpui.exe"; then echo "::error::identical binaries"; exit 1; fi
          fi
          git rev-parse HEAD > "$out/head.sha"
          ls -la "$out" "$out/head"
      - uses: actions/upload-artifact@v4
        with:
          name: bins-windows
          path: ${{ runner.temp }}/bins
          retention-days: 5

  windows-bench:
    name: Windows bench (hosted, WARP)
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/playback-perf
      - uses: actions/checkout@v4
        with:
          repository: CapSoftware/cap-performance-fixtures
          path: performance-fixtures
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bins-windows
          path: bins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bench
        shell: bash
        run: |
          set -uo pipefail
          python -m pip install -q psutil
          powershell -NoProfile -Command "Get-CimInstance Win32_VideoController | ForEach-Object { \$_.Name + ' ' + \$_.CurrentHorizontalResolution + 'x' + \$_.CurrentVerticalResolution }; (Get-CimInstance Win32_Processor).Name; (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors"
          bins=(--bin "head=$GITHUB_WORKSPACE/bins/head/cap-gpui.exe")
          [[ -d bins/base ]] && bins=(--bin "base=$GITHUB_WORKSPACE/bins/base/cap-gpui.exe" "${bins[@]}")
          python .github/playback-perf/bench.py "${bins[@]}" \
            --fixture "ref=$GITHUB_WORKSPACE/performance-fixtures/reference-recording.cap" \
            --out "$RUNNER_TEMP/bench" --rounds "$ROUNDS" --kinds "$KINDS" --timeout 900 \
            --label "Windows hosted 2022 (WARP)" --summary "$GITHUB_STEP_SUMMARY"
      - name: Print logs
        if: always()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/bench/summary.md" || true
          for log in "$RUNNER_TEMP"/bench/ref-play-*-0.log; do echo "=== $log"; grep -E "latency-bench|Playback stats|playback fps|WARN|ERROR|panicked|adapter" "$log" | cut -c1-400 | head -60; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-windows-hosted
          path: ${{ runner.temp }}/bench
          retention-days: 5
