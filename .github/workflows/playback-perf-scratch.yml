name: Playback perf scratch

on:
  push:
    branches:
      - "scratch/playback-perf*"

permissions:
  contents: read

# Each list is "label=commit label=commit": every arm is built in one tree and
# benched interleaved. An empty list skips that platform.
env:
  ARMS_MAC: ""
  ARMS_LINUX: "base=09bdc687c1adc0284916d635c8ad8eca9a46ed59 head=c67da6d8bf5ac17091ae73a2408135075b204dbc"
  ARMS_WIN: "base=09bdc687c1adc0284916d635c8ad8eca9a46ed59 head=c67da6d8bf5ac17091ae73a2408135075b204dbc"
  ROUNDS: "5"
  KINDS: "play,edit"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  plan:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      mac: ${{ steps.arms.outputs.mac }}
      linux: ${{ steps.arms.outputs.linux }}
      win: ${{ steps.arms.outputs.win }}
    steps:
      - id: arms
        run: |
          echo "mac=$ARMS_MAC" >> "$GITHUB_OUTPUT"
          echo "linux=$ARMS_LINUX" >> "$GITHUB_OUTPUT"
          echo "win=$ARMS_WIN" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS build and bench
    needs: plan
    if: needs.plan.outputs.mac != ''
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 170
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: CapSoftware/cap-performance-fixtures
          path: performance-fixtures
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ env.TARGET }}
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ env.TARGET }}
          prefix-key: v1-playback-perf
          save-cache: "true"
          cache-on-failure: "true"
          workspaces: apps/desktop-gpui -> target
      - name: Setup
        run: |
          set -euo pipefail
          node scripts/setup.js
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
        env:
          RUST_TARGET_TRIPLE: ${{ env.TARGET }}
      - name: Build
        env:
          ARMS: ${{ needs.plan.outputs.mac }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bins"
          bash .github/playback-perf/build-arms.sh "$out" \
            "$GITHUB_WORKSPACE/apps/desktop-gpui/target/$TARGET/release" "" --target "$TARGET"
          cp -R "$GITHUB_WORKSPACE/target/Frameworks" "$out/Frameworks"
          while read -r label _; do ln -sfn ../Frameworks "$out/$label/Frameworks"; done < "$out/arms.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bench
        run: |
          set -uo pipefail
          python -m pip install -q psutil
          sudo pmset -a displaysleep 0 sleep 0 || true
          caffeinate -u -t 2
          caffeinate -d -i -t 7000 &
          system_profiler SPDisplaysDataType | grep -E "Chipset|Resolution|Metal" || true
          sysctl -n hw.ncpu hw.memsize
          out="$RUNNER_TEMP/bins"
          bins=()
          while read -r label _; do bins+=(--bin "$label=$out/$label/cap-gpui"); done < "$out/arms.txt"
          python .github/playback-perf/bench.py "${bins[@]}" \
            --fixture "ref=$GITHUB_WORKSPACE/performance-fixtures/reference-recording.cap" \
            --out "$RUNNER_TEMP/bench" --rounds "$ROUNDS" --kinds "$KINDS" \
            --label "macOS Blacksmith 6 vCPU" --summary "$GITHUB_STEP_SUMMARY"
      - name: Print logs
        if: always()
        run: |
          cat "$RUNNER_TEMP/bench/summary.md" || true
          for log in "$RUNNER_TEMP"/bench/ref-play-*-0.log; do echo "=== $log"; grep -E "latency-bench|Playback stats|playback fps|WARN|ERROR|panicked" "$log" | cut -c1-400 | head -60; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-macos
          path: ${{ runner.temp }}/bench
          retention-days: 5
      - uses: actions/upload-artifact@v4
        with:
          name: bins-macos
          path: ${{ runner.temp }}/bins
          retention-days: 5

  linux:
    name: Linux build and bench
    needs: plan
    if: needs.plan.outputs.linux != ''
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: CapSoftware/cap-performance-fixtures
          path: performance-fixtures
          persist-credentials: false
      - name: Install Linux desktop dependencies
        uses: ./.github/actions/install-desktop-deps
      - run: sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools dbus x11-utils >/dev/null
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-unknown-linux-gnu
          prefix-key: v1-playback-perf
          save-cache: "true"
          cache-on-failure: "true"
          workspaces: apps/desktop-gpui -> target
      - name: Setup
        run: |
          set -euo pipefail
          node scripts/setup.js
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
        env:
          RUST_TARGET_TRIPLE: x86_64-unknown-linux-gnu
      - name: Build
        env:
          ARMS: ${{ needs.plan.outputs.linux }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bins"
          bash .github/playback-perf/build-arms.sh "$out" \
            "$GITHUB_WORKSPACE/apps/desktop-gpui/target/release" ""
          mkdir -p "$out/libs"
          cp -a target/native-deps/lib/. "$out/libs/"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bench (Xvfb, lavapipe)
        run: |
          set -uo pipefail
          python -m pip install -q psutil
          nproc; free -g | head -2
          out="$RUNNER_TEMP/bins"
          bins=()
          while read -r label _; do bins+=(--bin "$label=$out/$label/cap-gpui"); done < "$out/arms.txt"
          export VK_LOADER_LAYERS_DISABLE=VK_LAYER_MESA_device_select
          dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" \
            python .github/playback-perf/bench.py "${bins[@]}" \
            --fixture "ref=$GITHUB_WORKSPACE/performance-fixtures/reference-recording.cap" \
            --lib-dir "$out/libs" \
            --out "$RUNNER_TEMP/bench" --rounds "$ROUNDS" --kinds "$KINDS" \
            --label "Linux Blacksmith 8 vCPU, Xvfb + lavapipe" --summary "$GITHUB_STEP_SUMMARY"
      - name: Print logs
        if: always()
        run: |
          cat "$RUNNER_TEMP/bench/summary.md" || true
          for log in "$RUNNER_TEMP"/bench/ref-play-*-0.log; do echo "=== $log"; grep -E "latency-bench|Playback stats|playback fps|WARN|ERROR|panicked|adapter" "$log" | cut -c1-400 | head -60; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-linux
          path: ${{ runner.temp }}/bench
          retention-days: 5
      - uses: actions/upload-artifact@v4
        with:
          name: bins-linux
          path: ${{ runner.temp }}/bins
          retention-days: 5

  windows-build:
    name: Windows build
    needs: plan
    if: needs.plan.outputs.win != ''
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 170
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-pc-windows-msvc
          prefix-key: v1-playback-perf
          save-cache: "true"
          cache-on-failure: "true"
          workspaces: apps/desktop-gpui -> target
      - name: Setup
        shell: bash
        run: |
          set -euo pipefail
          node scripts/setup.js
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
      - name: Build
        shell: bash
        env:
          ARMS: ${{ needs.plan.outputs.win }}
        run: |
          set -euo pipefail
          bash .github/playback-perf/build-arms.sh "$RUNNER_TEMP/bins" \
            "$GITHUB_WORKSPACE/apps/desktop-gpui/target/$TARGET/release" ".exe" --target "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: bins-windows
          path: ${{ runner.temp }}/bins
          retention-days: 5

  windows-bench:
    name: Windows bench (hosted, WARP)
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/playback-perf
      - uses: actions/checkout@v4
        with:
          repository: CapSoftware/cap-performance-fixtures
          path: performance-fixtures
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bins-windows
          path: bins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bench
        shell: bash
        run: |
          set -uo pipefail
          python -m pip install -q psutil
          powershell -NoProfile -Command "Get-CimInstance Win32_VideoController | ForEach-Object { \$_.Name + ' ' + \$_.CurrentHorizontalResolution + 'x' + \$_.CurrentVerticalResolution }; (Get-CimInstance Win32_Processor).Name; (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors"
          bins=()
          while read -r label _; do bins+=(--bin "$label=$GITHUB_WORKSPACE/bins/$label/cap-gpui.exe"); done < bins/arms.txt
          python .github/playback-perf/bench.py "${bins[@]}" \
            --fixture "ref=$GITHUB_WORKSPACE/performance-fixtures/reference-recording.cap" \
            --out "$RUNNER_TEMP/bench" --rounds "$ROUNDS" --kinds "$KINDS" --timeout 900 \
            --label "Windows hosted 2022 (WARP)" --summary "$GITHUB_STEP_SUMMARY"
      - name: Print logs
        if: always()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/bench/summary.md" || true
          for log in "$RUNNER_TEMP"/bench/ref-play-*-0.log; do echo "=== $log"; grep -E "latency-bench|Playback stats|playback fps|WARN|ERROR|panicked|adapter" "$log" | cut -c1-400 | head -60; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-windows-hosted
          path: ${{ runner.temp }}/bench
          retention-days: 5
