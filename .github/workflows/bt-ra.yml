name: BT real-app fixtures
# Scratch only (never landed): base vs fix vs fix2 of the diarizer on BT's fixtures through the real app.
on:
  push:
    branches: [ci/bt-ra3]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bt-ra-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
  BASE_SHA: 09bdc687c1
  FIXTURES: "music ret default"
  REPS: "1 2"
jobs:
  linux:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/install-desktop-deps
      - name: Harness tools
        run: |
          sudo apt-get install -y -qq --no-install-recommends xvfb x11-utils xdotool imagemagick dbus \
            pulseaudio pulseaudio-utils libasound2-plugins ffmpeg openssl openbox > /dev/null
          if ! command -v google-chrome > /dev/null; then
            curl -fsSL -o "$RUNNER_TEMP/chrome.deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y -qq "$RUNNER_TEMP/chrome.deb" > /dev/null
          fi
      - uses: dtolnay/rust-toolchain@1.95.0
        with: { targets: x86_64-unknown-linux-gnu }
      - uses: ./.github/actions/setup-rust-cache
        with: { target: x86_64-unknown-linux-gnu, prefix-key: v1-rust-meetings, save-cache: "false", workspaces: apps/desktop-gpui -> target }
      - run: node scripts/setup.js
        env: { RUST_TARGET_TRIPLE: x86_64-unknown-linux-gnu }
      - run: node scripts/sync-desktop-versions.mjs && ./scripts/prepare-gpui-dependency.sh
      - name: Build fix and base
        run: |
          set -e
          b=apps/desktop-gpui/target/release/cap-gpui
          cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --release --bin cap-gpui
          cp $b $RUNNER_TEMP/cap-gpui-fix
          sed -i.bak 's/const RETURN_LAG_FRAMES: (i64, i64) = (6, 50);/const RETURN_LAG_FRAMES: (i64, i64) = (6, 150);/' apps/desktop-gpui/diarize/src/diarizer.rs && grep -q '(6, 150)' apps/desktop-gpui/diarize/src/diarizer.rs
          cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --release --bin cap-gpui
          cp $b $RUNNER_TEMP/cap-gpui-fix2
          git restore --source=$BASE_SHA --worktree -- apps/desktop-gpui/diarize
          cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --release --bin cap-gpui
          cp $b $RUNNER_TEMP/cap-gpui-base
          git restore --source=HEAD --worktree -- apps/desktop-gpui/diarize
          md5sum $RUNNER_TEMP/cap-gpui-*
      - uses: actions/cache@v4
        with: { path: "${{ runner.temp }}/meeting-models", key: "meeting-models-v1-${{ hashFiles('scripts/ci/meetings/models.sh') }}" }
      - run: bash scripts/ci/meetings/models.sh "$RUNNER_TEMP/meeting-models"
      - name: Meetings
        run: |
          for rep in $REPS; do for fx in $FIXTURES; do for arm in base fix fix2; do
            pulseaudio --kill 2> /dev/null || true; pkill -x pulseaudio 2> /dev/null || true; sleep 1
            if [ $fx = default ]; then unset CAP_MEETINGS_FIX; else export CAP_MEETINGS_FIX=$GITHUB_WORKSPACE/bt-fx/$fx; fi
            W=$RUNNER_TEMP/bt/$fx-$arm-$rep
            CAP_MEETINGS_ONLY_LOCAL=1 env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 \
              LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/native-deps/lib" \
              ORT_DYLIB_PATH="$GITHUB_WORKSPACE/target/native-deps/onnxruntime/lib/libonnxruntime.so" \
              CAP_MEETINGS_MODELS="$RUNNER_TEMP/meeting-models" \
              dbus-run-session -- bash scripts/ci/meetings/linux.sh "$RUNNER_TEMP/cap-gpui-$arm" "$W" > "$RUNNER_TEMP/bt-$fx-$arm-$rep.log" 2>&1 || true
            R=$W/local; D=$(python3 -c "import json;print(json.load(open('$R/summary.json'))['docDir'])" 2>/dev/null || true); cp "$D/transcript.jsonl" "$R/" 2>/dev/null || true
            echo "== $fx $arm $rep $(cat $R/score.json 2>/dev/null)"
          done; done; done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bt-ra-linux
          path: |
            ${{ runner.temp }}/bt/*/local/check.txt
            ${{ runner.temp }}/bt/*/local/score.json
            ${{ runner.temp }}/bt/*/local/offsets.json
            ${{ runner.temp }}/bt/*/local/page_started.log
            ${{ runner.temp }}/bt/*/local/app.log
            ${{ runner.temp }}/bt/*/local/transcript.jsonl
            ${{ runner.temp }}/bt-*.log
          retention-days: 7

  build-windows:
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@1.95.0
        with: { targets: x86_64-pc-windows-msvc }
      - uses: ./.github/actions/setup-rust-cache
        with: { target: x86_64-pc-windows-msvc, prefix-key: v1-rust-meetings, save-cache: "false", workspaces: apps/desktop-gpui -> target }
      - shell: bash
        run: node scripts/setup.js
        env: { RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc }
      - shell: bash
        run: node scripts/sync-desktop-versions.mjs && ./scripts/prepare-gpui-dependency.sh
      - name: Build fix and base
        shell: bash
        run: |
          set -e
          stage="$RUNNER_TEMP/stage"; mkdir -p "$stage/gpui-windows-shaders"
          cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --release --bin cap-gpui
          cp apps/desktop-gpui/target/release/cap-gpui.exe "$stage/cap-gpui-fix.exe"
          sed -i.bak 's/const RETURN_LAG_FRAMES: (i64, i64) = (6, 50);/const RETURN_LAG_FRAMES: (i64, i64) = (6, 150);/' apps/desktop-gpui/diarize/src/diarizer.rs && grep -q '(6, 150)' apps/desktop-gpui/diarize/src/diarizer.rs
          cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --release --bin cap-gpui
          cp apps/desktop-gpui/target/release/cap-gpui.exe "$stage/cap-gpui-fix2.exe"
          git restore --source=$BASE_SHA --worktree -- apps/desktop-gpui/diarize
          cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --release --bin cap-gpui
          cp apps/desktop-gpui/target/release/cap-gpui.exe "$stage/cap-gpui-base.exe"
          git restore --source=HEAD --worktree -- apps/desktop-gpui/diarize
          cp ../zed-cap/crates/gpui_windows/src/*.hlsl "$stage/gpui-windows-shaders/"
          printf '%s' "$GITHUB_WORKSPACE" > "$stage/build-workspace.txt"
          printf '%s' "$(cd ../zed-cap && pwd -W)" > "$stage/build-zed.txt"
          md5sum "$stage"/*.exe
      - uses: actions/upload-artifact@v4
        with: { name: bt-ra-windows-app, path: "${{ runner.temp }}/stage", retention-days: 1 }

  windows:
    needs: build-windows
    runs-on: windows-2022
    timeout-minutes: 300
    env: { FIXTURES: "music ret retw default" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bt-ra-windows-app, path: "${{ runner.temp }}/app" }
      - shell: pwsh
        run: |
          $app = "$env:RUNNER_TEMP\app"
          $workspace = (Get-Content "$app\build-workspace.txt" -Raw).Trim()
          if ($workspace -ne $env:GITHUB_WORKSPACE) {
            New-Item -ItemType Directory -Force (Split-Path $workspace) | Out-Null
            cmd /c mklink /J "$workspace" "$env:GITHUB_WORKSPACE"
          }
          $shaders = Join-Path (Get-Content "$app\build-zed.txt" -Raw).Trim() "crates\gpui_windows\src"
          New-Item -ItemType Directory -Force $shaders | Out-Null
          Copy-Item "$app\gpui-windows-shaders\*.hlsl" $shaders
      - shell: bash
        run: node scripts/setup.js
        env: { RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc }
      - shell: pwsh
        run: scripts/ci/meetings/setup_audio.ps1
      - shell: pwsh
        run: |
          for ($i = 1; $i -le 4 -and -not (Get-Command ffmpeg -ErrorAction SilentlyContinue); $i++) {
            choco install ffmpeg -y --no-progress | Out-Null
            $choco = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { 'C:\ProgramData\chocolatey' }
            if (Test-Path "$choco\bin\ffmpeg.exe") { $env:Path = "$choco\bin;$env:Path"; Add-Content $env:GITHUB_PATH "$choco\bin" } else { Start-Sleep -Seconds (30 * $i) }
          }
          ffmpeg -version | Select-Object -First 1
      - uses: actions/cache@v4
        with: { path: "${{ runner.temp }}/meeting-models", key: "meeting-models-v1-${{ hashFiles('scripts/ci/meetings/models.sh') }}" }
      - shell: bash
        run: bash scripts/ci/meetings/models.sh "$RUNNER_TEMP/meeting-models"
      - name: Meetings
        shell: pwsh
        run: |
          Copy-Item "$env:GITHUB_WORKSPACE\target\release\*.dll" "$env:RUNNER_TEMP\app\"
          $env:CAP_MEETINGS_MODELS = "$env:RUNNER_TEMP\meeting-models"
          $env:CAP_MEETINGS_ONLY_LOCAL = '1'
          foreach ($rep in $env:REPS.Split(' ')) { foreach ($fx in $env:FIXTURES.Split(' ')) { foreach ($arm in 'base', 'fix', 'fix2') {
            if ($fx -eq 'default') { Remove-Item Env:CAP_MEETINGS_FIX -ErrorAction SilentlyContinue } else { $env:CAP_MEETINGS_FIX = "$env:GITHUB_WORKSPACE\bt-fx\$fx" }
            $W = "$env:RUNNER_TEMP\bt\$fx-$arm-$rep"
            & scripts/ci/meetings/windows.ps1 -Bin "$env:RUNNER_TEMP\app\cap-gpui-$arm.exe" -Work $W *> "$env:RUNNER_TEMP\bt-$fx-$arm-$rep.log"
            $R = "$W\local"
            $D = python -c "import json;print(json.load(open(r'$R\summary.json'))['docDir'])" 2>$null
            if ($D) { Copy-Item "$D\transcript.jsonl" "$R\" -ErrorAction SilentlyContinue }
            "== $fx $arm $rep $(Get-Content "$R\score.json" -ErrorAction SilentlyContinue)"
          } } }
          exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bt-ra-windows
          path: |
            ${{ runner.temp }}/bt/*/local/check.txt
            ${{ runner.temp }}/bt/*/local/score.json
            ${{ runner.temp }}/bt/*/local/offsets.json
            ${{ runner.temp }}/bt/*/local/page_started.log
            ${{ runner.temp }}/bt/*/local/app.log
            ${{ runner.temp }}/bt/*/local/transcript.jsonl
            ${{ runner.temp }}/bt-*.log
          retention-days: 7

