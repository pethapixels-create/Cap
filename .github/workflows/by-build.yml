name: Scratch BY lifecycle builds
# Temporary measurement branch (deleted after use). Builds Cap three ways per platform:
# ship-pre (main just before Cap Notes merged) and ship-head (this branch), both plain release as
# shipped, and hx-head (release + debug assertions + BY's measurement logs) for the scripted
# meeting and UI benches. Nothing here ships.

on:
  push:
    branches: [ci/by-life]

permissions:
  contents: read

concurrency:
  group: by-life
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, mac-arm, mac-x64]
        variant: [ship-pre, ship-head, hx-head]
        include:
          - os: linux
            runner: blacksmith-8vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
          - os: windows
            runner: blacksmith-8vcpu-windows-2025
            target: x86_64-pc-windows-msvc
          - os: mac-arm
            runner: blacksmith-6vcpu-macos-15
            target: aarch64-apple-darwin
          - os: mac-x64
            runner: blacksmith-6vcpu-macos-15
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: by-src
          sparse-checkout: .by
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ matrix.variant == 'ship-pre' && 'd6f0ae586421bc68a1614ce662327d92f74acb81' || github.sha }}
          path: app
      - name: Move the app checkout into place
        shell: bash
        run: |
          shopt -s dotglob
          mv app/* .
          rmdir app
          git log --oneline -1
      - if: runner.os == 'Linux'
        uses: ./.github/actions/install-desktop-deps
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ matrix.target }}
          prefix-key: v1-rust-meetings
          save-cache: "false"
          workspaces: apps/desktop-gpui -> target
      - shell: bash
        run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: ${{ matrix.target }}
      - shell: bash
        run: |
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.variant }}" = hx-head ]; then
            export CARGO_PROFILE_RELEASE_DEBUG=0 CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS=true
            python3 by-src/.by/by-harness.py "$PWD"
            git diff --stat
          fi
          cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --release --target ${{ matrix.target }} --bin cap-gpui
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/pkg"; mkdir -p "$P/bin" "$P/lib"
          T=apps/desktop-gpui/target/${{ matrix.target }}/release
          git rev-parse HEAD > "$P/commit.txt"
          echo "${{ matrix.variant }}" > "$P/variant.txt"
          case "${{ matrix.os }}" in
            linux)
              cp "$T/cap-gpui" "$P/bin/"
              cp -P target/native-deps/lib/*.so* "$P/lib/" 2> /dev/null || true
              cp target/native-deps/onnxruntime/lib/libonnxruntime.so* "$P/lib/"
              ;;
            mac-*)
              cp "$T/cap-gpui" "$P/bin/"; codesign --force -s - "$P/bin/cap-gpui"
              mkdir -p "$P/Frameworks"
              cp -RL target/Frameworks/Spacedrive.framework "$P/Frameworks/" 2> /dev/null || true
              find target/native-deps -name 'libonnxruntime*.dylib' -exec cp -P {} "$P/lib/" \; || true
              lipo -info "$P/bin/cap-gpui"
              ;;
            windows)
              cp "$T/cap-gpui.exe" "$P/bin/"
              cp target/release/*.dll "$P/bin/" 2> /dev/null || true
              find target -maxdepth 4 -iname 'onnxruntime*.dll' -exec cp {} "$P/bin/" \; || true
              mkdir -p "$P/shaders"; cp ../zed-cap/crates/gpui_windows/src/*.hlsl "$P/shaders/" 2> /dev/null || true
              printf '%s' "$(cd ../zed-cap && pwd -W)" > "$P/build-zed.txt"
              printf '%s' "$(pwd -W)" > "$P/build-workspace.txt"
              ;;
          esac
          ls -la "$P/bin" "$P/lib" | head -60
          tar czf "$RUNNER_TEMP/by-${{ matrix.os }}-${{ matrix.variant }}.tgz" -C "$P" .
          ls -la "$RUNNER_TEMP"/by-*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: by-${{ matrix.os }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/by-${{ matrix.os }}-${{ matrix.variant }}.tgz
          retention-days: 5
