name: Probe bisect

on:
  push:
    branches:
      - "probe/blank-preview-bisect*"

permissions:
  contents: read

jobs:
  hatch:
    name: escape hatch ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: main, sha: 9a39305f8a264d76ba75f2f8291f45b5dfd62adf }
          - { label: fix, sha: 0107fb2ff61306ac8d8683bddba217afbc3d9773 }
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-pc-windows-msvc
          prefix-key: v1-rust-sync
          save-cache: "false"
      - uses: ./.github/actions/install-desktop-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Native dependencies
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: node scripts/setup.js
      - name: Add FFmpeg DLLs to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ github.workspace }}\\target\\ffmpeg\\bin"
      - name: Machine
        shell: pwsh
        run: |
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-List
          (Get-Item C:\Windows\System32\d3d10warp.dll).VersionInfo.ProductVersion
          [Environment]::OSVersion.Version.ToString()
      - name: Notch and shared pass tests
        shell: bash
        continue-on-error: true
        run: |
          cargo +1.95.0 test --locked -p cap-rendering --lib -- notch layers_sharing_a_pass --nocapture 2>&1 | grep -v "^ *Compiling" > hatch.log || true
          echo "--- hatch lines"
          grep -n -i "cannot composite\|skipping\|adapter\|test result\|panicked\|FAILED\|^test " hatch.log | cut -c1-240 | head -80
