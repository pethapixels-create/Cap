name: Probe bisect

on:
  push:
    branches:
      - "probe/blank-preview-bisect*"

permissions:
  contents: read

env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  TARGET: x86_64-pc-windows-msvc

jobs:
  build:
    name: build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: c46, sha: 7f03de634fe5fbb2cefb7752827de1988146eace }
          - { label: c47, sha: ea4a2c0ae38b75cf0c990bc32d77170292957fcc }
          - { label: c48, sha: 93622e4c94a3057c28f4c5f3abb6df238a9acda7 }
          - { label: c49, sha: a22f7d24ed60c9488f16bb38ba406dfb2fae0be4 }
          - { label: c50, sha: 052206ee6b49b8515e5be2aa75d897c36628bb11 }
          - { label: c51, sha: ab921e4a5ae11644ec80d791448ad0ffe24276c6 }
          - { label: c52, sha: 5b07a0ba15bb95911a6d3635ababfea733a1dc06 }
          - { label: c53, sha: ee4b9717a996af15151323d200f99e300a078355 }
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 120
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-pc-windows-msvc
          prefix-key: v1-playback-perf
          save-cache: "false"
          workspaces: apps/desktop-gpui -> target
      - name: Setup
        shell: bash
        run: |
          set -euo pipefail
          node scripts/setup.js
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --target "$TARGET" --release --bin cap-gpui 2>&1 | grep -v "^ *Compiling" | tail -8
          out="$RUNNER_TEMP/bins/${{ matrix.label }}"
          mkdir -p "$out"
          release="$GITHUB_WORKSPACE/apps/desktop-gpui/target/$TARGET/release"
          cp "$release/cap-gpui.exe" "$out/"
          cp "$GITHUB_WORKSPACE"/target/release/*.dll "$out/" 2>/dev/null || true
          find "$release" -maxdepth 1 -name '*.dll' -exec cp {} "$out/" \;
          git rev-parse HEAD > "$out/sha.txt"
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.label }}
          path: ${{ runner.temp }}/bins
          retention-days: 3
