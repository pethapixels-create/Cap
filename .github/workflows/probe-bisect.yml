name: Probe bisect

on:
  push:
    branches:
      - "probe/blank-preview-bisect*"

permissions:
  contents: read

env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  TARGET: x86_64-pc-windows-msvc

jobs:
  build:
    name: build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: c04, sha: 2fcb4ae0907deca7c54334479646b07924a4c7c3 }
          - { label: c09, sha: 7fee58dedf321bf2874262a4c110d5ea95ba22c6 }
          - { label: c13, sha: 569d0c7f93b2a014ff1463acf93226ca0a92a6c7 }
          - { label: c18, sha: 21fd8425f606e9cd8c4370a889a2ffc6c8957b8f }
          - { label: c22, sha: 170eada2c13304f245dacd719bd201a23d55c8be }
          - { label: c27, sha: 05f1377eb675337a4e4341c6ddc3289f98fbc2c1 }
          - { label: c31, sha: 6af4ec965675ff0586dd5545ba0d01d30173c2a4 }
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 120
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Current setup script
        shell: bash
        run: |
          git fetch -q --depth 1 origin 09bdc687c1adc0284916d635c8ad8eca9a46ed59
          git show FETCH_HEAD:scripts/setup.js > scripts/setup.js
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-pc-windows-msvc
          prefix-key: v1-playback-perf
          save-cache: "false"
          workspaces: apps/desktop-gpui -> target
      - name: Setup
        shell: bash
        run: |
          set -euo pipefail
          node scripts/setup.js
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --target "$TARGET" --release --bin cap-gpui 2>&1 | grep -v "^ *Compiling" | tail -8
          out="$RUNNER_TEMP/bins/${{ matrix.label }}"
          mkdir -p "$out"
          release="$GITHUB_WORKSPACE/apps/desktop-gpui/target/$TARGET/release"
          cp "$release/cap-gpui.exe" "$out/"
          cp "$GITHUB_WORKSPACE"/target/release/*.dll "$out/" 2>/dev/null || true
          find "$release" -maxdepth 1 -name '*.dll' -exec cp {} "$out/" \;
          git rev-parse HEAD > "$out/sha.txt"
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.label }}
          path: ${{ runner.temp }}/bins
          retention-days: 3
